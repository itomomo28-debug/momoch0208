<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="写真や動画からInstagramリールを作成">
  <title>Reel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <a class="brand" href="/"><span>R</span> Reel Studio</a>
    <div class="header-actions"><div class="badge">Instagram 9:16</div><button id="manageClients" class="quiet-button">案件を管理</button></div>
  </header>

  <main>
    <section class="workspace-bar">
      <div><span class="workspace-label">CLIENT WORKSPACE</span><strong id="activeClientName">ペシェ子様 リトリートアカウント運用</strong></div>
      <nav id="clientTabs" aria-label="顧客案件"></nav>
    </section>
    <section class="intro">
      <p class="eyebrow">CREATE YOUR MOMENT</p>
      <h1>いつもの素材を、<br><em>惹きつけるリール</em>に。</h1>
      <p class="lead">写真と動画を選ぶだけ。Instagramにぴったりの縦型動画へ、数秒で仕上げます。</p>
    </section>

    <section class="studio">
      <div class="editor">
        <div class="step"><span>01</span><div><strong>素材を選ぶ</strong><small>最大12個・選択順に再生</small></div></div>
        <label class="dropzone" id="dropzone">
          <input id="files" type="file" accept="image/*,video/*" multiple>
          <div class="upload-icon">＋</div>
          <strong>写真・動画を追加</strong>
          <span>クリック、またはここにドラッグ</span>
        </label>
        <div id="mediaList" class="media-list"></div>

        <div class="step settings-step"><span>02</span><div><strong>仕上がりを調整</strong><small>素材ごとの表示時間</small></div></div>
        <div class="controls">
          <label>表示時間 <output id="durationValue">3秒</output><input id="duration" type="range" min="1" max="10" value="3"></label>
          <label>余白の色 <input id="background" type="color" value="#101014"></label>
        </div>
        <button id="render" disabled><span>リールを書き出す</span><b>→</b></button>
        <p id="status" role="status"></p>
      </div>

      <aside class="preview-wrap">
        <div class="phone">
          <div class="phone-top"></div>
          <div id="preview" class="preview"><div class="empty"><b>9:16</b><span>プレビュー</span></div></div>
          <div class="reel-ui"><span>♡</span><span>◯</span><span>⌁</span></div>
        </div>
        <p>1080 × 1920 px · MP4</p>
      </aside>
    </section>
  </main>

  <dialog id="clientDialog">
    <form method="dialog" id="clientForm">
      <div class="dialog-head"><div><span class="workspace-label">WORKSPACES</span><h2>顧客案件を管理</h2></div><button value="cancel" aria-label="閉じる">×</button></div>
      <p>顧客ごとにブランド設定と制作履歴を分けて管理します。</p>
      <div id="clientFields" class="client-fields"></div>
      <button class="save-clients" value="default">変更を保存</button>
    </form>
  </dialog>

  <template id="mediaTemplate"><div class="media-item"><div class="thumb"></div><div class="meta"><strong></strong><span></span></div><button aria-label="削除">×</button></div></template>
  <script type="module" src="/app.js"></script>
</body>
</html>
